name: build

on:
  push:
    branches: ["main", "fix/implanta-supabase-perfis", "fix/usuarios-editar-inativar-2026-10-02"]
  pull_request:
    branches: ["fix/implanta-supabase-perfis"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
