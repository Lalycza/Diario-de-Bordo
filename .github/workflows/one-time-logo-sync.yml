        run: |
          curl -fsSL "$LOGO_URL" -o /tmp/hpro-horizontal.png
          test -s /tmp/hpro-horizontal.png
      - name: Replace sidebar logo only
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          b64=base64.b64encode(Path("/tmp/hpro-horizontal.png").read_bytes()).decode("ascii")
          pat=r'(<aside class="side"><img class="brand-logo" src="data:image/png;base64,)[A-Za-z0-9+/=]+(")'
          ns,n=re.subn(pat, lambda m:m.group(1)+b64+m.group(2), s, count=1)
          if n != 1:
              raise SystemExit(f"sidebar logo target not found: {n}")
          p.write_text(ns,encoding="utf-8")
          PY
      - name: Commit logo replacement
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: substituir logo lateral pelo HPRO oficial"
          git push
